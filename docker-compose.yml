# Local development and test environment for local_simplemcp.
#
#   make up          bring the stack up and install Moodle + the plugin
#   make phpunit     run this plugin's PHPUnit suite
#   make check       run the same static checks CI runs
#
# Everything is disposable: `make down` keeps your data, `make clean` does not.
# See dev/README.md for the full walkthrough.

name: simplemcp

services:
  db:
    image: postgres:${POSTGRES_VERSION:-14}-alpine
    environment:
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: moodle
      POSTGRES_DB: moodle
      # Moodle requires a case-sensitive, byte-ordered collation.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U moodle -d moodle']
      interval: 5s
      timeout: 5s
      retries: 20
    # Exposed so you can inspect the database with psql from the host.
    ports:
      - '${DB_PORT:-55432}:5432'

  moodle:
    build:
      context: ./dev
      dockerfile: Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.1}
    depends_on:
      db:
        condition: service_healthy
    environment:
      MOODLE_BRANCH: ${MOODLE_BRANCH:-MOODLE_401_STABLE}
      MOODLE_WWWROOT: http://localhost:${WEB_PORT:-8080}
      MOODLE_ADMIN_USER: ${MOODLE_ADMIN_USER:-admin}
      MOODLE_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD:-Moodle.dev1}
      MOODLE_ADMIN_EMAIL: ${MOODLE_ADMIN_EMAIL:-admin@example.com}
      DB_HOST: db
      DB_NAME: moodle
      DB_USER: moodle
      DB_PASS: moodle
      # Behat needs to reach a browser; only used by `make behat`.
      SELENIUM_URL: http://selenium:4444/wd/hub
      BEHAT_WWWROOT: http://moodle/behat
    volumes:
      - moodle-src:/var/www/html
      # The plugin itself is bind-mounted, so an edit on the host is live
      # inside the container with no rebuild and no copy step.
      - ./local-simplemcp:/var/www/html/local/simplemcp
      - ./dev:/opt/dev:ro
      - moodledata:/var/www/moodledata
      - moodledata-phpunit:/var/www/phpu_moodledata
      - moodledata-behat:/var/www/behat_moodledata
      - moodledata-behatfaildumps:/var/www/behat_faildumps
    ports:
      - '${WEB_PORT:-8080}:80'
    # PHPUnit and Behat both want more than the PHP default.
    shm_size: 1gb

  # Only started by `make behat` (or `docker compose --profile behat up`).
  selenium:
    image: selenium/standalone-chrome:${SELENIUM_VERSION:-125.0}
    profiles: ['behat']
    shm_size: 2gb
    ports:
      - '${VNC_PORT:-7900}:7900'

volumes:
  db-data:
  moodle-src:
  moodledata:
  moodledata-phpunit:
  moodledata-behat:
  moodledata-behatfaildumps:
